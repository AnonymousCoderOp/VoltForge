<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1513" />
    <meta name="description" content="VoltForge — intelligent microgrid operations, energy forecasting, dispatch optimization and resilience monitoring." />
    <title>VoltForge · Microgrid Control</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("voltforge-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.theme = savedTheme;
        } else {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (_) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
